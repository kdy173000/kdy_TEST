<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출고 폼 · 파이어볼</title>
<link rel="stylesheet" href="../../shared/portal.css?v=round15-140"><link rel="stylesheet" href="../../shared/portal-nav.css?v=receipt-purchasing149"><link rel="stylesheet" href="style.css?v=local-forms150">
<script src="../../shared/session.js?v=order-role147"></script><script defer src="../../shared/order-access.js?v=order-role147"></script><script defer src="../../shared/portal-nav.js?v=shipping-forms148"></script><script defer src="model.js?v=local-forms150"></script><script defer src="script.js?v=local-forms150"></script></head>
<body><header class="portal-header"><a class="portal-brand" href="../../main/index.html"><img class="portal-logo" src="../../shared/assets/fireball-logo.png" alt="FIREBALL" width="209" height="38"></a><div class="portal-header-actions"></div></header>
<main id="workspace" hidden><div class="form-heading"><div><p class="eyebrow">출고팀 · 폼 관리</p><h1>출고 폼</h1><p class="muted">질문을 만들고 작성 화면과 응답을 확인하세요.</p></div><button id="newForm" type="button" class="staff-primary">+ 새 폼</button></div>
<p class="local-banner">브라우저 체험용 · 폼과 테스트 응답은 이 브라우저에만 저장됩니다. 외부 공개·공유는 연결 후 사용할 수 있어요.</p>
<div class="forms-layout"><aside class="form-card"><h2>내 폼</h2><div id="formList"></div></aside>
<section class="form-main"><p id="empty" class="form-card muted">‘새 폼’으로 첫 번째 출고 폼을 만들어보세요.</p><div id="formWorkspace" hidden>
<div class="form-toolbar"><div class="form-tabs" role="tablist" aria-label="폼 관리"><button type="button" role="tab" id="editTab" aria-controls="editPanel" aria-selected="true">질문 편집</button><button type="button" role="tab" id="previewTab" aria-controls="previewPanel" aria-selected="false" tabindex="-1">미리보기</button><button type="button" role="tab" id="responsesTab" aria-controls="responsesPanel" aria-selected="false" tabindex="-1">응답 <span id="responseCount">0</span></button></div><button type="button" id="openParticipant">작성 화면 열기 ↗</button></div>
<section id="editPanel" role="tabpanel" aria-labelledby="editTab"><form id="editor"><div class="form-card"><label class="form-field">폼 제목<input id="title" required maxlength="100" placeholder="예: 제품 출고 신청"></label><label class="form-field">설명<textarea id="description" maxlength="1000" rows="2" placeholder="작성자에게 안내할 내용을 입력하세요."></textarea></label></div><div id="questions"></div><div class="form-actions"><button type="button" id="addQuestion">+ 질문 추가</button><span id="saveState" class="muted"></span><button type="submit" class="staff-primary">폼 저장</button></div></form></section>
<section id="previewPanel" class="form-card" role="tabpanel" aria-labelledby="previewTab" hidden><p class="local-banner">미리보기 · 여기서 제출한 내용은 저장되지 않습니다.</p><div id="preview"></div></section>
<section id="responsesPanel" class="form-card" role="tabpanel" aria-labelledby="responsesTab" hidden><div class="form-heading"><h2>응답 내역</h2><button type="button" id="refreshResponses">새로고침</button></div><div id="responseList"></div></section>
</div><p id="status" role="status"></p></section></div></main></body></html>
