<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>권한 링크 설정</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

<link rel="stylesheet" href="style.css?v=settings9">

<script defer src="script.js"></script>
<link rel="stylesheet" href="../../shared/portal-nav.css?v=scroll13">
<script defer src="../../shared/portal-nav.js?v=scroll13"></script>
</head>
<body>

<header class="portal-header"><a class="portal-brand" href="../main/index.html">FIREBALL<span>권한 링크 설정</span></a><div class="portal-header-actions"><a class="portal-header-button" href="../main/index.html">관리자 홈</a><a class="portal-header-button" href="../accounts/index.html">계정 관리</a><button class="portal-header-button" onclick="doLogout()">로그아웃</button></div></header>

<div class="container">
  <p class="eyebrow">사내 운영 · 관리자</p><h1 class="page-title">권한 링크 설정</h1>
  <div class="page-sub">
    권한별로 연결할 페이지 URL을 입력하세요. 테스트로 링크를 확인한 후 저장하면 반영됩니다.
  </div>

  <div class="add-item-card">
    <label class="add-item-label" for="newPermName">새 권한 항목</label>
    <input class="add-item-input" id="newPermName" placeholder="예: 디자인팀, 영업팀 …"
      onkeydown="if(event.key==='Enter')addCustomPerm()">
    <button class="add-item-btn" onclick="addCustomPerm()">+ 항목 추가</button>
  </div>
  <div id="permCards"></div>

  <div class="save-bar">
    <button class="save-btn" onclick="saveLinks()">저장</button>
    <span class="save-msg" id="saveMsg">✅ 저장되었습니다.</span>
  </div>
</div>


</body>
</html>
