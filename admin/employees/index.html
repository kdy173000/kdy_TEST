<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직원 관리</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

<link rel="stylesheet" href="style.css?v=settings9">

<script defer src="script.js"></script>
<link rel="stylesheet" href="../../shared/portal-nav.css?v=nav12">
<script defer src="../../shared/portal-nav.js?v=nav12"></script>
</head>
<body>

<header class="portal-header"><a class="portal-brand" href="../main/index.html">FIREBALL<span>직원 관리</span></a><div class="portal-header-actions"><a class="portal-header-button" href="../main/index.html">관리자 홈</a><button class="portal-header-button" onclick="toggleTheme()" aria-label="테마 전환"><span id="t-ico">☀️</span></button><button class="portal-header-button" onclick="doLogout()">로그아웃</button></div></header>

<div class="container">
  <p class="eyebrow">사내 운영 · 관리자</p><h1 class="page-title">직원 관리</h1>
  <div class="page-sub">팀별 직원 현황을 관리합니다. 직원 카드와 팀을 드래그하여 이동할 수 있습니다.</div>
  <div id="orgRoot"></div>
</div>

<div class="modal-overlay" id="empModal" style="display:none" onclick="if(event.target===this)closeEmpModal()">
  <div class="modal">
    <div class="modal-title" id="empModalTitle">직원 추가</div>
    <div class="modal-fields">
      <div class="field"><label>이름</label><input id="empName" placeholder="예: 김다영"></div>
      <div class="field"><label>직책</label><input id="empRank" placeholder="예: 대리"></div>
      <div class="field"><label>핸드폰 번호</label><input id="empPhone" type="tel" placeholder="예: 010-1234-5678"></div>
      <div class="field"><label>소속 팀</label><select id="empTeamSel"></select></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="saveEmp()">저장</button>
      <button class="modal-btn sec" onclick="closeEmpModal()">취소</button>
    </div>
  </div>
</div>


</body>
</html>
