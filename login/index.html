<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<script src="../shared/session.js?v=order-role147"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이어볼 사내 운영 포털</title>


<link rel="stylesheet" href="style.css?v=password-eye143">

<script defer src="script.js?v=password-eye143"></script>
<link rel="stylesheet" href="../shared/searchable-select.css?v=round-panels139"><script defer src="../shared/searchable-select.js?v=search-all93"></script></head>
<body>

<header class="portal-header"><a class="portal-brand" href="index.html"><img class="portal-logo" src="../shared/assets/fireball-logo.png" alt="FIREBALL" width="209" height="38"><span>사내 운영 포털</span></a><div class="portal-header-actions"><button class="portal-header-button" onclick="toggleTheme()"><span id="t-ico">◐</span> <span id="t-lbl">다크 모드</span></button></div></header><main class="login-stage">

<div class="card">

  <div class="card-header">

    <h1 class="card-header-title">로그인</h1>
    <p class="card-header-sub">사내 계정으로 운영 포털에 접속하세요.</p>
  </div>

  <div class="card-body">
    <div class="field">
      <label for="userId">아이디</label>
      <input type="text" id="userId" placeholder="아이디 입력" autocomplete="username"
        onkeydown="if(event.key==='Enter')document.getElementById('userPw').focus()">
    </div>
    <div class="field">
      <label for="userPw">비밀번호</label>
      <div class="password-field">
      <input type="password" id="userPw" placeholder="비밀번호 입력" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" id="passwordVisibility" class="password-visibility" aria-label="비밀번호 표시" aria-controls="userPw" aria-pressed="false" title="비밀번호 보기">
          <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M9.5 6.3A11.8 11.8 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3 3.4M6.2 7.7A15 15 0 0 0 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.9-.8"/></svg>
        </button>
      </div>
    </div>
    <div class="err-msg" id="errMsg" role="alert"></div>
    <button class="login-btn" onclick="doLogin()">로그인</button>
  </div>

  <div class="card-footer">
    파이어볼 주식회사 &copy; 2026<br>
    문의 : 관리자에게 연락해 주세요
  </div>

</div>

</main>
</body>
</html>
