<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이어볼 사내 운영 포털</title>
<link rel="stylesheet" href="portal-common.css">
<style>
*{margin:0;padding:0}body{min-height:100vh;display:flex;flex-direction:column}.login-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:50px 20px}.card{width:420px;max-width:100%;border:1px solid var(--border);border-radius:14px;background:var(--bg2);overflow:hidden}.card-header{padding:32px 32px 0;text-align:left}.card-header-title{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.4;color:var(--text)}.card-header-sub{font-size:13px;color:var(--text3);margin-top:8px}.card-body{padding:28px 32px;display:flex;flex-direction:column;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:14px;font-weight:500;color:var(--text2)}.field input{height:46px;padding:11px 12px;border-radius:7px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:14px;width:100%;outline:none}.field input::placeholder{color:var(--text3)}.field input:focus{outline:2px solid #f2b4b6;border-color:var(--accent)}.login-btn{padding:12px 16px;border-radius:8px;border:1px solid #d82e35;background:#d82e35;color:#fff;font-size:14px;font-weight:600;width:100%}.login-btn:hover{background:#ba2229}.err-msg{font-size:13px;color:#ba2229;min-height:20px}.card-footer{border-top:1px solid var(--border);padding:20px 32px;text-align:left;font-size:12px;color:var(--text3);line-height:1.9}@media(max-width:700px){.card-header{padding:26px 24px 0}.card-body{padding:25px 24px}.card-footer{padding:18px 24px}.card-header-title{font-size:27px}.login-stage{padding:35px 20px}}
</style>
</head>
<body>

<header class="portal-header"><a class="portal-brand" href="index.html">FIREBALL<span>사내 운영 포털</span></a><div class="portal-header-actions"><button class="portal-header-button" onclick="toggleTheme()"><span id="t-ico">◐</span> <span id="t-lbl">다크 모드</span></button></div></header><main class="login-stage">

<div class="card">

  <div class="card-header">

    <h1 class="card-header-title">로그인</h1>
    <p class="card-header-sub">사내 계정으로 운영 포털에 접속하세요.</p>
  </div>

  <div class="card-body">
    <div class="field">
      <label for="userId">아이디</label>
      <input type="text" id="userId" placeholder="아이디 입력" autocomplete="username"
        onkeydown="if(event.key==='Enter')document.getElementById('userPw').focus()">
    </div>
    <div class="field">
      <label for="userPw">비밀번호</label>
      <input type="password" id="userPw" placeholder="비밀번호 입력" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="err-msg" id="errMsg" role="alert"></div>
    <button class="login-btn" onclick="doLogin()">로그인</button>
  </div>

  <div class="card-footer">
    파이어볼 주식회사 &copy; 2026<br>
    문의 : 관리자에게 연락해 주세요
  </div>

</div>

</main><script>
function toggleTheme() {
  const h = document.documentElement;
  const dark = h.dataset.theme === 'dark';
  h.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('t-ico').textContent = '◐';
  document.getElementById('t-lbl').textContent = dark ? '다크 모드' : '라이트 모드';
}

const FIXED_ACCOUNTS = [
  { id: 'fireballadmin', pw: 'adminfireball', role: 'admin', redirect: 'https://kdy173000.github.io/kdy_TEST/admin.html' },
  { id: '23060801', pw: '940214', role: 'manager', name: '김다영', redirect: 'https://kdy173000.github.io/kdy_TEST/main.html' },
];

function getAllAccounts() {
  const stored = JSON.parse(localStorage.getItem('fb_accounts') || '[]');
  return [...FIXED_ACCOUNTS, ...stored];
}

function doLogin() {
  const id = document.getElementById('userId').value.trim();
  const pw = document.getElementById('userPw').value;
  const err = document.getElementById('errMsg');
  if (!id) { err.textContent = '아이디를 입력해 주세요.'; return; }
  if (!pw) { err.textContent = '비밀번호를 입력해 주세요.'; return; }

  const account = getAllAccounts().find(a => a.id === id && a.pw === pw);
  if (account) {
    const isAdmin = account.role === 'admin' || (account.perms && account.perms.includes('관리자'));
    sessionStorage.setItem('fb_user', JSON.stringify({ id: account.id, role: account.role || (isAdmin?'admin':'user'), name: account.name || account.id, perms: account.perms || [] }));
    window.location.href = isAdmin
      ? (account.redirect || 'https://kdy173000.github.io/kdy_TEST/admin.html')
      : 'https://kdy173000.github.io/kdy_TEST/main.html';
  } else {
    err.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
  }
}
</script>
</body>
</html>
