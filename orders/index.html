<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파이어볼 · 발주 관리</title><script src="../shared/session.js?v=session48"></script><link rel="stylesheet" href="../shared/order-pages.css?v=nav-search72"><link rel="stylesheet" href="../shared/portal-nav.css?v=nav-search72"><script defer src="../shared/material-store.js?v=business70"></script><script defer src="../shared/materials-ui.js?v=version-market66"></script><script defer src="../shared/search-picker.js?v=nav-search72"></script><script defer src="../shared/order-document.js?v=print71"></script><script defer src="script.js?v=nav-search72"></script><script defer src="../shared/portal-nav.js?v=nav-search72"></script></head><body><header class="portal-header"><a class="portal-brand" href="../main/index.html"><img class="portal-logo" src="../shared/assets/fireball-logo.png" alt="FIREBALL" width="209" height="38"><span>발주 관리</span></a><div class="portal-header-actions"></div></header><main class="order-page"><div class="heading"><div><p class="eyebrow">부자재 · 발주 · 입고</p><h1>발주 관리</h1><p class="page-note">등록한 발주는 부자재의 입고 대기 및 업체별 이력에 함께 표시됩니다.</p></div><div class="action-group"><a class="plain-link" href="../suppliers/index.html">업체 관리</a><button id="startOrder" class="primary" hidden>＋ 발주 등록</button></div></div><section id="orderEditor" class="panel" hidden><div class="sectionhead"><h2>발주 등록</h2><button id="cancelOrder" type="button">닫기</button></div><p class="page-note">제품명과 업체는 등록된 목록에서 선택하세요. 저장 전에는 재고 및 발주 이력에 반영되지 않습니다.</p><form id="orderForm"><div class="order-editor-toolbar"><label>담당자<input id="orderPerson" maxlength="30" required></label></div><div class="tablewrap"><table class="order-entry"><thead><tr><th>날짜</th><th>제품명</th><th>버전</th><th>수량</th><th>업체</th><th>메모</th><th>입고 예정일</th><th>관리</th></tr></thead><tbody id="draftRows"></tbody></table></div><div class="editor-footer"><button id="addRow" type="button">＋ 품목 추가</button><div class="action-group"><button id="previewDraft" type="button">인쇄</button><button class="primary" type="submit" id="saveOrders">발주 저장</button></div></div><p id="orderError" role="alert"></p></form></section><section class="panel"><div class="sectionhead"><h2>발주 내역 <span id="orderCount" class="page-note"></span></h2><div class="action-group"><button id="previewSelected" type="button">선택 내역 인쇄</button><button id="downloadOrders" type="button">선택 내역 다운로드 · CSV</button></div></div><div class="order-filters"><input id="orderSearch" aria-label="발주 검색" placeholder="제품명 · 코드 · 발주번호 · 메모 검색"><select id="supplierFilter" aria-label="업체 필터"></select><select id="statusFilter" aria-label="입고 상태"><option value="">전체 상태</option><option value="pending">입고 전</option><option value="partial">부분 입고</option><option value="done">입고 완료</option><option value="closed">잔량 마감</option></select><label>시작일<input id="fromDate" type="date"></label><label>종료일<input id="toDate" type="date"></label><button id="resetFilters" type="button">초기화</button></div><div class="tablewrap"><table class="order-history"><thead><tr><th><input id="selectAll" type="checkbox" aria-label="조회한 발주 전체 선택"></th><th>날짜</th><th>제품명</th><th>버전</th><th class="num">수량</th><th>업체</th><th>메모</th><th>입고 상태</th><th>정상 입고 / 잔량</th><th>재고</th></tr></thead><tbody id="orderRows"></tbody></table></div></section></main><dialog id="orderPreview" class="order-preview"><header class="preview-toolbar"><strong>발주서 미리보기</strong><div class="action-group"><button id="previewSave" type="button">SAVE · 저장</button><button id="previewPrint" type="button">PRINT · 인쇄</button><button id="previousPage" type="button" aria-label="이전 페이지">◀</button><span id="pageNumber"></span><button id="nextPage" type="button" aria-label="다음 페이지">▶</button><button id="closePreview" type="button">닫기</button></div></header><div id="previewPaper" class="preview-paper-wrap"></div><section id="previewSavePanel" class="preview-save-panel" hidden><h3>파일 저장</h3><label class="field"><span>파일 형식</span><select id="previewFormat"><option value="xlsx">엑셀 저장 (*.xlsx)</option><option value="pdf">PDF 저장 (*.pdf) · 인쇄 창에서 PDF 선택</option><option disabled>엑셀 저장 (*.xls) · 변환 기능 필요</option><option disabled>한글 저장 (*.hwp) · 변환 기능 필요</option><option disabled>DOC 저장 (*.doc) · 변환 기능 필요</option><option disabled>DOC 저장 (*.docx) · 변환 기능 필요</option><option disabled>PPT 저장 (*.pptx) · 변환 기능 필요</option><option disabled>한셀 저장 (*.cell) · 변환 기능 필요</option></select></label><label class="field"><span>저장할 페이지</span><select id="previewRange"><option value="all">전체 페이지</option><option value="current">현재 페이지</option><option value="range">페이지 지정</option></select></label><div class="row" id="previewRangeFields" hidden><label class="field"><span>시작 페이지</span><input id="pageFrom" type="number" min="1" value="1"></label><label class="field"><span>마지막 페이지</span><input id="pageTo" type="number" min="1" value="1"></label></div><p id="previewSaveError" role="alert"></p><div class="modalfoot"><button id="cancelPreviewSave" type="button">취소</button><button id="confirmPreviewSave" class="primary" type="button">저장</button></div></section></dialog><iframe id="orderPrintFrame" title="발주서 인쇄" style="position:fixed;width:1px;height:1px;left:-10000px;border:0"></iframe><div id="toast" role="status"></div></body></html>
