<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파이어볼 · 발주 관리</title><script src="../shared/session.js?v=session48"></script><link rel="stylesheet" href="../shared/order-pages.css?v=business70"><link rel="stylesheet" href="../shared/portal-nav.css?v=bluegray45"><script defer src="../shared/material-store.js?v=business70"></script><script defer src="../shared/materials-ui.js?v=version-market66"></script><script defer src="script.js?v=business70"></script><script defer src="../shared/portal-nav.js?v=orders68"></script></head><body><header class="portal-header"><a class="portal-brand" href="../main/index.html"><img class="portal-logo" src="../shared/assets/fireball-logo.png" alt="FIREBALL" width="209" height="38"><span>발주 관리</span></a><div class="portal-header-actions"></div></header><main class="order-page"><div class="heading"><div><p class="eyebrow">부자재 · 발주 · 입고</p><h1>발주 관리</h1><p class="page-note">등록한 발주는 부자재의 입고 대기 및 업체별 이력에 함께 표시됩니다.</p></div><div class="action-group"><a class="plain-link" href="../suppliers/index.html">업체 관리</a><button id="startOrder" class="primary" hidden>＋ 발주 등록</button></div></div><section id="orderEditor" class="panel" hidden><div class="sectionhead"><h2>발주 등록</h2><button id="cancelOrder" type="button">닫기</button></div><p class="page-note">제품명과 업체는 등록된 목록에서 선택하세요. 저장 전에는 재고 및 발주 이력에 반영되지 않습니다.</p><form id="orderForm"><div class="order-editor-toolbar"><label class="draft-search-label">제품 검색<input id="draftSearch" type="search" placeholder="부자재명 · 코드로 선택 목록 좁히기"></label><label>담당자<input id="orderPerson" maxlength="30" required></label></div><div class="tablewrap"><table class="order-entry"><thead><tr><th>날짜</th><th>제품명</th><th>버전</th><th>수량</th><th>업체</th><th>메모</th><th>입고 예정일</th><th>관리</th></tr></thead><tbody id="draftRows"></tbody></table></div><div class="editor-footer"><button id="addRow" type="button">＋ 품목 추가</button><button class="primary" type="submit" id="saveOrders">발주 저장</button></div><p id="orderError" role="alert"></p></form></section><section class="panel"><div class="sectionhead"><h2>발주 내역 <span id="orderCount" class="page-note"></span></h2><button id="downloadOrders" type="button">선택 내역 다운로드 · CSV</button></div><div class="order-filters"><input id="orderSearch" aria-label="발주 검색" placeholder="제품명 · 코드 · 발주번호 · 메모 검색"><select id="supplierFilter" aria-label="업체 필터"></select><select id="statusFilter" aria-label="입고 상태"><option value="">전체 상태</option><option value="pending">입고 전</option><option value="partial">부분 입고</option><option value="done">입고 완료</option><option value="closed">잔량 마감</option></select><label>시작일<input id="fromDate" type="date"></label><label>종료일<input id="toDate" type="date"></label><button id="resetFilters" type="button">초기화</button></div><div class="tablewrap"><table class="order-history"><thead><tr><th><input id="selectAll" type="checkbox" aria-label="조회한 발주 전체 선택"></th><th>날짜</th><th>제품명</th><th>버전</th><th class="num">수량</th><th>업체</th><th>메모</th><th>입고 상태</th><th>정상 입고 / 잔량</th><th>재고</th></tr></thead><tbody id="orderRows"></tbody></table></div></section></main><div id="toast" role="status"></div></body></html>
